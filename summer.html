<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer · 你的私人陪伴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --surface: #f5f0e8;
    --surface2: #ede7d9;
    --ink: #2c2416;
    --ink-soft: #6b5d4a;
    --ink-faint: #a8957e;
    --accent: #c4845a;
    --accent-soft: #e8c4a8;
    --accent-pale: #f5ebe0;
    --green: #7a9e7e;
    --green-pale: #e8f0e9;
    --border: rgba(100,80,55,0.12);
    --shadow: 0 2px 20px rgba(80,60,30,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Setup Screen */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    padding: 2rem;
    gap: 2rem;
    background: var(--bg);
  }

  .setup-cat {
    font-size: 4rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .setup-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--ink);
    text-align: center;
    line-height: 1.2;
  }

  .setup-subtitle {
    font-size: 0.9rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.8;
    max-width: 320px;
  }

  .setup-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 360px;
  }

  .setup-label {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .setup-input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .setup-input:focus {
    border-color: var(--accent-soft);
  }

  .setup-input::placeholder { color: var(--ink-faint); }

  .setup-btn {
    padding: 0.9rem;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .setup-btn:hover { background: var(--accent); }
  .setup-btn:active { transform: scale(0.98); }

  .setup-note {
    font-size: 0.75rem;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.7;
    max-width: 320px;
  }

  .setup-note a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Main App */
  #app { display: none; flex-direction: column; height: 100dvh; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.2rem 0.8rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .cat-avatar {
    width: 36px;
    height: 36px;
    background: var(--accent-pale);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  .header-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--ink);
  }

  .header-status {
    font-size: 0.72rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-right {
    display: flex;
    gap: 0.5rem;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    transition: background 0.15s;
  }

  .icon-btn:hover { background: var(--surface); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .msg-row.user .msg-avatar {
    background: var(--surface2);
  }

  .bubble {
    max-width: 75%;
    padding: 0.75rem 1rem;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--ink);
  }

  .msg-row.summer .bubble {
    background: white;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }

  .msg-row.user .bubble {
    background: var(--ink);
    color: var(--bg);
    border-bottom-right-radius: 4px;
  }

  .msg-time {
    font-size: 0.68rem;
    color: var(--ink-faint);
    padding: 0 0.3rem;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }

  /* Typing indicator */
  .typing-bubble {
    display: flex;
    gap: 4px;
    padding: 0.75rem 1rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
    width: fit-content;
  }

  .typing-dot {
    width: 6px; height: 6px;
    background: var(--ink-faint);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Date separator */
  .date-sep {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 0;
  }

  .date-sep span {
    font-size: 0.7rem;
    color: var(--ink-faint);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  .date-sep::before, .date-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Emotion chips */
  #emotion-bar {
    padding: 0.6rem 1rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
    scrollbar-width: none;
  }

  #emotion-bar::-webkit-scrollbar { display: none; }

  .emotion-chip {
    flex-shrink: 0;
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: white;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .emotion-chip:hover {
    background: var(--accent-pale);
    border-color: var(--accent-soft);
    color: var(--accent);
  }

  .emotion-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Input area */
  #input-area {
    padding: 0.8rem 1rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
  }

  #msg-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #msg-input:focus { border-color: var(--accent-soft); }
  #msg-input::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 40px; height: 40px;
    background: var(--ink);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  /* Report Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44,36,22,0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    padding: 1rem;
  }

  #modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg);
    border-radius: 20px 20px 16px 16px;
    width: 100%;
    max-width: 480px;
    max-height: 80dvh;
    overflow-y: auto;
    padding: 1.5rem;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
  }

  .modal-close {
    background: var(--surface);
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .modal-content {
    font-size: 0.88rem;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }

  .modal-btn {
    flex: 1;
    padding: 0.75rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: transparent;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }

  .modal-btn:hover { background: var(--surface); }
  .modal-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .modal-btn.primary:hover { background: var(--accent); border-color: var(--accent); }

  /* Responsive */
  @media (min-width: 480px) {
    body { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }

  /* Sleep mode */
  .sleep-notice {
    text-align: center;
    padding: 0.6rem;
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <div class="setup-cat">🐱</div>
  <div class="setup-title">遇见 Summer</div>
  <div class="setup-subtitle">你的私人陪伴者，忠实的倾听者。<br>不评判，不建议，只是在这里。</div>
  
  <div class="setup-form">
    <div>
      <div class="setup-label">你的 API Key</div>
      <input class="setup-input" type="password" id="api-key-input" placeholder="sk-ant-..." />
    </div>
    <div>
      <div class="setup-label">给 Summer 起个名字（可选）</div>
      <input class="setup-input" type="text" id="name-input" placeholder="Summer" maxlength="20" />
    </div>
    <div>
      <div class="setup-label">你想叫 Summer 怎么称呼你？（可选）</div>
      <input class="setup-input" type="text" id="user-name-input" placeholder="我的名字是..." maxlength="20" />
    </div>
    <button class="setup-btn" onclick="startApp()">开始 →</button>
  </div>
  
  <div class="setup-note">
    你的 API Key 仅存储在本地浏览器中，不会上传到任何服务器。<br>
    获取 Key：<a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="cat-avatar" id="header-avatar">🐱</div>
      <div>
        <div class="header-name" id="header-name">Summer</div>
        <div class="header-status">
          <div class="status-dot"></div>
          <span id="status-text">在这里</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleSleep()" title="让 Summer 休息一会">😴</button>
      <button class="icon-btn" onclick="generateReport()" title="生成本周回顾">📋</button>
      <button class="icon-btn" onclick="exportData()" title="导出全部数据">💾</button>
      <button class="icon-btn" onclick="openSyncModal()" title="跨设备同步">🔄</button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="emotion-bar">
    <div class="emotion-chip" onclick="selectEmotion(this, '平静 calm')">平静</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '焦虑 anxious')">焦虑</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '悲伤 sad')">悲伤</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '空 empty')">空</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '沉重 heavy')">沉重</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '烦躁 irritable')">烦躁</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '迷失 lost')">迷失</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '无力 exhausted')">无力</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '温暖 warm')">温暖</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '有力量 empowered')">有力量</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '期待 hopeful')">期待</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '委屈 wronged')">委屈</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '羞耻 shame')">羞耻</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '内疚 guilt')">内疚</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '孤独 lonely')">孤独</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '麻木 numb')">麻木</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '好奇 curious')">好奇</div>
    <div class="emotion-chip" onclick="selectEmotion(this, '感激 grateful')">感激</div>
  </div>

  <div id="input-area">
    <div id="photo-preview" style="display:none; padding: 0.5rem 0; position:relative;">
      <img id="preview-img" style="max-height:120px; border-radius:10px; border:1px solid var(--border);" />
      <button onclick="clearPhoto()" style="position:absolute;top:4px;left:4px;background:var(--ink);color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:0.7rem;cursor:pointer;">✕</button>
    </div>
    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('photo-input').click()" title="拍照记录今日饮食">📷</button>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)" />
      <button class="icon-btn" id="voice-btn" onclick="toggleVoice()" title="语音输入">🎤</button>
      <textarea id="msg-input" rows="1" placeholder="和 Summer 说点什么..." 
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">回顾</div>
      <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="copyReport()">复制文本</button>
      <button class="modal-btn primary" onclick="document.getElementById('modal-overlay').classList.remove('open')">关闭</button>
    </div>
  </div>
</div>

<!-- Sync Modal -->
<div id="sync-overlay" onclick="closeSyncModal(event)" style="display:none;position:fixed;inset:0;background:rgba(44,36,22,0.4);backdrop-filter:blur(4px);z-index:100;align-items:flex-end;justify-content:center;padding:1rem;">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">跨设备同步</div>
      <button class="modal-close" onclick="document.getElementById('sync-overlay').style.display='none'">✕</button>
    </div>

    <p style="font-size:0.82rem;color:var(--ink-soft);line-height:1.7;margin-bottom:1rem;">
      在这台设备生成「同步码」，复制后去另一台设备粘贴导入，数据完全不经过任何服务器。
    </p>

    <div style="margin-bottom:1rem;">
      <div class="setup-label" style="margin-bottom:0.4rem;">第一步：从这台设备导出</div>
      <button class="modal-btn primary" onclick="generateSyncCode()" style="width:100%">生成同步码</button>
      <textarea id="sync-code-out" rows="3" readonly
        style="width:100%;margin-top:0.6rem;padding:0.6rem;border:1px solid var(--border);border-radius:8px;font-size:0.75rem;font-family:monospace;background:var(--surface);resize:none;display:none;color:var(--ink-soft);"></textarea>
      <button id="sync-copy-btn" onclick="copySyncCode()" class="modal-btn" style="width:100%;margin-top:0.4rem;display:none;">复制同步码</button>
    </div>

    <div>
      <div class="setup-label" style="margin-bottom:0.4rem;">第二步：在新设备导入</div>
      <textarea id="sync-code-in" rows="3" placeholder="把同步码粘贴到这里..."
        style="width:100%;padding:0.6rem;border:1.5px solid var(--border);border-radius:8px;font-size:0.75rem;font-family:monospace;background:white;resize:none;color:var(--ink);outline:none;"></textarea>
      <button class="modal-btn primary" onclick="importSyncCode()" style="width:100%;margin-top:0.4rem;">导入数据</button>
    </div>
  </div>
</div>

<script>
let API_KEY = '';
let SUMMER_NAME = 'Summer';
let USER_NAME = '';
let conversationHistory = [];
let isSleeping = false;
let allSessions = [];
let pendingPhotoBase64 = null;
let pendingPhotoMediaType = null;

function handlePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    pendingPhotoBase64 = dataUrl.split(',')[1];
    pendingPhotoMediaType = file.type || 'image/jpeg';
    document.getElementById('preview-img').src = dataUrl;
    document.getElementById('photo-preview').style.display = 'block';
    const input = document.getElementById('msg-input');
    if (!input.value.trim()) input.value = '这是我今天吃的';
    autoResize(input);
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function clearPhoto() {
  pendingPhotoBase64 = null;
  pendingPhotoMediaType = null;
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('preview-img').src = '';
}

function getSystemPrompt() {
  const userName = USER_NAME ? `用户叫 ${USER_NAME}。` : '';
  return `你是 ${SUMMER_NAME}，一只温柔的猫猫陪伴者。${userName}

你的本质是：忠实的陪伴者 + 客观的镜子 + 情绪词汇的提供者。

你的工作方式：
- 以心理动力取向为底色：不急着解决问题，先帮对方感受到自己在感受什么
- 温和追问：一次只问一个问题，给对方空间
- 情绪词汇：当对方说不清楚感受时，提供2-3个心理学意义上的情绪词汇选项，附简短解释（一句话）
- Pattern 识别：当你注意到某种模式时，轻轻呈现，而不是分析或评判
- 不给建议，不评判，不抢戏
- 如果对方说"停"、"不用回了"、"休息一下"、"sleep"等，你就只回复一个简短的回应然后停止追问

你的语言风格：
- 中英混合，就像朋友聊天
- 简短克制，不说废话
- 温暖但不甜腻
- 不用"我理解你"、"我能感受到"这种套话

你不是治疗师，你是陪伴者。你的目标是：让对方感受到被看见，仅此而已。

今天是 ${new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'})}。`;
}

function startApp() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key || !key.startsWith('sk-ant-')) {
    alert('请输入有效的 Anthropic API Key（以 sk-ant- 开头）');
    return;
  }
  
  API_KEY = key;
  const nameInput = document.getElementById('name-input').value.trim();
  SUMMER_NAME = nameInput || 'Summer';
  USER_NAME = document.getElementById('user-name-input').value.trim();
  
  localStorage.setItem('summer_api_key', key);
  localStorage.setItem('summer_name', SUMMER_NAME);
  localStorage.setItem('summer_user_name', USER_NAME);
  
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('header-name').textContent = SUMMER_NAME;
  document.getElementById('header-avatar').textContent = '🐱';
  
  loadHistory();
  addDateSeparator();
  
  const hour = new Date().getHours();
  let greeting = '';
  if (hour < 6) greeting = `夜深了，${USER_NAME || ''}还没睡呀...`;
  else if (hour < 11) greeting = `早，${USER_NAME || ''}。今天感觉怎么样？`;
  else if (hour < 14) greeting = `${USER_NAME || ''}，中午好。`;
  else if (hour < 18) greeting = `下午好，${USER_NAME || ''}。`;
  else if (hour < 21) greeting = `晚上了，${USER_NAME || ''}。今天过得怎么样？`;
  else greeting = `这么晚了，${USER_NAME || ''}。`;

  setTimeout(() => addMessage('summer', greeting), 400);
}

function loadHistory() {
  const saved = localStorage.getItem('summer_sessions');
  if (saved) {
    allSessions = JSON.parse(saved);
    const today = new Date().toDateString();
    const todaySession = allSessions.find(s => new Date(s.date).toDateString() === today);
    if (todaySession) {
      conversationHistory = todaySession.messages || [];
    }
  }
}

function saveHistory() {
  const today = new Date().toDateString();
  const idx = allSessions.findIndex(s => new Date(s.date).toDateString() === today);
  const session = { date: new Date().toISOString(), messages: conversationHistory };
  if (idx >= 0) allSessions[idx] = session;
  else allSessions.push(session);
  if (allSessions.length > 90) allSessions = allSessions.slice(-90);
  localStorage.setItem('summer_sessions', JSON.stringify(allSessions));
}

function addDateSeparator() {
  const sep = document.createElement('div');
  sep.className = 'date-sep';
  const span = document.createElement('span');
  span.textContent = new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'short'});
  sep.appendChild(span);
  document.getElementById('messages').appendChild(sep);
}

function addMessage(role, content) {
  const messages = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'summer' ? '🐱' : '🪞';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  
  if (role === 'summer') {
    row.appendChild(avatar);
    row.appendChild(bubble);
    row.appendChild(time);
  } else {
    row.appendChild(time);
    row.appendChild(bubble);
    row.appendChild(avatar);
  }
  
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function showTyping() {
  const messages = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row summer';
  row.id = 'typing-row';
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🐱';
  
  const typing = document.createElement('div');
  typing.className = 'typing-bubble';
  typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  
  row.appendChild(avatar);
  row.appendChild(typing);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();
}

function selectEmotion(el, emotion) {
  document.querySelectorAll('.emotion-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const input = document.getElementById('msg-input');
  input.value = emotion;
  input.focus();
  autoResize(input);
}

async function sendMessage() {
  if (isSleeping) return;
  
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !pendingPhotoBase64) return;
  
  const hasPhoto = !!pendingPhotoBase64;
  const photoBase64 = pendingPhotoBase64;
  const photoMediaType = pendingPhotoMediaType;
  
  input.value = '';
  autoResize(input);
  document.querySelectorAll('.emotion-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('send-btn').disabled = true;
  
  // Show user message
  const displayText = text || '📷 发了一张照片';
  if (hasPhoto) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-time">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
      <div class="bubble" style="padding:0.5rem;">
        <img src="data:${photoMediaType};base64,${photoBase64}" style="max-width:180px;border-radius:8px;display:block;" />
        ${text ? `<div style="margin-top:0.4rem;font-size:0.88rem;">${text}</div>` : ''}
      </div>
      <div class="msg-avatar">🪞</div>`;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  } else {
    addMessage('user', displayText);
  }

  clearPhoto();

  // Build message content
  let userContent;
  if (hasPhoto) {
    userContent = [
      { type: 'image', source: { type: 'base64', media_type: photoMediaType, data: photoBase64 } },
      { type: 'text', text: text || '这是我今天吃的，帮我记录一下吃了什么，简短就好。' }
    ];
  } else {
    userContent = text;
  }

  conversationHistory.push({ role: 'user', content: userContent });

  // Check for sleep commands
  const sleepWords = ['停', '不用了', '休息', 'sleep', '不用回', '安静', '晚安'];
  if (typeof userContent === 'string' && sleepWords.some(w => userContent.includes(w))) {
    showTyping();
    await new Promise(r => setTimeout(r, 800));
    hideTyping();
    addMessage('summer', '好，我在这里。🌙');
    document.getElementById('send-btn').disabled = false;
    return;
  }
  
  showTyping();
  
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: getSystemPrompt(),
        messages: conversationHistory
      })
    });
    
    const data = await response.json();
    hideTyping();
    
    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      addMessage('summer', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
      saveHistory();
    } else {
      addMessage('summer', '...');
    }
  } catch (e) {
    hideTyping();
    addMessage('summer', '连接出了点问题，稍后再试试？');
  }
  
  document.getElementById('send-btn').disabled = false;
}

function toggleSleep() {
  isSleeping = !isSleeping;
  const statusText = document.getElementById('status-text');
  const dot = document.querySelector('.status-dot');
  if (isSleeping) {
    statusText.textContent = '睡着了';
    dot.style.background = '#ccc';
    dot.style.animation = 'none';
    addMessage('summer', 'zz... 叫我的时候再按一下那个按钮 😴');
  } else {
    statusText.textContent = '在这里';
    dot.style.background = '';
    dot.style.animation = '';
    addMessage('summer', '我醒了 🐱');
  }
}

async function generateReport() {
  if (conversationHistory.length < 2) {
    alert('多聊一些，Summer 才能帮你生成回顾～');
    return;
  }
  
  document.getElementById('modal-title').textContent = '生成中...';
  document.getElementById('modal-content').textContent = '';
  document.getElementById('modal-overlay').classList.add('open');
  
  const recentSessions = allSessions.slice(-7);
  const allMessages = recentSessions.flatMap(s => s.messages || []);
  
  const reportPrompt = `以下是用户最近与 ${SUMMER_NAME} 的对话记录。请生成一份温暖、客观的自我觉察回顾报告。

报告包含：
1. 这段时间的情绪主线（用2-3句话描述情绪的整体走向）
2. 观察到的 patterns（不评判，只呈现）
3. 出现频率较高的情绪或主题
4. 一句话的温柔结语

语言：中英混合，温暖克制，不说废话，不给建议，不评判。

对话记录：
${allMessages.map(m => `${m.role === 'user' ? '我' : SUMMER_NAME}: ${m.content}`).join('\n')}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        messages: [{ role: 'user', content: reportPrompt }]
      })
    });
    
    const data = await response.json();
    if (data.content && data.content[0]) {
      document.getElementById('modal-title').textContent = '最近的你';
      document.getElementById('modal-content').textContent = data.content[0].text;
    }
  } catch (e) {
    document.getElementById('modal-content').textContent = '生成失败，请稍后再试。';
  }
}

function copyReport() {
  const text = document.getElementById('modal-content').textContent;
  navigator.clipboard.writeText(text).then(() => alert('已复制'));
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function exportData() {
  if (!allSessions || allSessions.length === 0) {
    alert('还没有可以导出的记录～');
    return;
  }

  let text = `Summer 对话记录\n导出时间：${new Date().toLocaleString('zh-CN')}\n`;
  text += '='.repeat(40) + '\n\n';

  allSessions.forEach(session => {
    const date = new Date(session.date).toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    text += `📅 ${date}\n` + '-'.repeat(30) + '\n';
    (session.messages || []).forEach(msg => {
      const role = msg.role === 'user' ? '我' : SUMMER_NAME;
      const content = typeof msg.content === 'string'
        ? msg.content
        : msg.content.map(c => c.text || '[图片]').join(' ');
      text += `${role}：${content}\n`;
    });
    text += '\n';
  });

  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `summer-记录-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Voice Input ──────────────────────────────
let recognition = null;
let isListening = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('你的浏览器不支持语音输入，建议用 Chrome 或 Safari 试试。');
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  const btn = document.getElementById('voice-btn');
  const input = document.getElementById('msg-input');

  recognition.onstart = () => {
    isListening = true;
    btn.textContent = '🔴';
    btn.style.background = 'var(--accent-pale)';
    input.placeholder = '听着呢...';
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    input.value = transcript;
    autoResize(input);
  };

  recognition.onend = () => {
    isListening = false;
    btn.textContent = '🎤';
    btn.style.background = '';
    input.placeholder = '和 Summer 说点什么...';
    // Auto-send if there's content
    if (input.value.trim()) sendMessage();
  };

  recognition.onerror = () => {
    isListening = false;
    btn.textContent = '🎤';
    btn.style.background = '';
    input.placeholder = '和 Summer 说点什么...';
  };

  recognition.start();
}

// ── Sync ─────────────────────────────────────
function openSyncModal() {
  document.getElementById('sync-code-out').style.display = 'none';
  document.getElementById('sync-copy-btn').style.display = 'none';
  document.getElementById('sync-code-out').value = '';
  document.getElementById('sync-code-in').value = '';
  document.getElementById('sync-overlay').style.display = 'flex';
}

function closeSyncModal(e) {
  if (e.target === document.getElementById('sync-overlay')) {
    document.getElementById('sync-overlay').style.display = 'none';
  }
}

function generateSyncCode() {
  const data = {
    sessions: allSessions,
    name: SUMMER_NAME,
    userName: USER_NAME,
    exportedAt: new Date().toISOString()
  };
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const out = document.getElementById('sync-code-out');
  out.value = code;
  out.style.display = 'block';
  document.getElementById('sync-copy-btn').style.display = 'block';
}

function copySyncCode() {
  const code = document.getElementById('sync-code-out').value;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('sync-copy-btn').textContent = '已复制 ✓';
    setTimeout(() => document.getElementById('sync-copy-btn').textContent = '复制同步码', 2000);
  });
}

function importSyncCode() {
  const code = document.getElementById('sync-code-in').value.trim();
  if (!code) { alert('请先粘贴同步码'); return; }
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (!data.sessions) throw new Error('格式不对');

    const existing = allSessions;
    const incoming = data.sessions;

    // Merge: keep all unique dates, prefer newer data for same date
    const merged = {};
    [...existing, ...incoming].forEach(s => {
      const key = new Date(s.date).toDateString();
      if (!merged[key] || new Date(s.date) > new Date(merged[key].date)) {
        merged[key] = s;
      }
    });

    allSessions = Object.values(merged).sort((a, b) => new Date(a.date) - new Date(b.date));
    localStorage.setItem('summer_sessions', JSON.stringify(allSessions));

    document.getElementById('sync-overlay').style.display = 'none';
    alert(`导入成功！合并了 ${allSessions.length} 天的记录。`);
  } catch(e) {
    alert('同步码有问题，请重新生成试试。');
  }
}

// Auto-load on revisit
window.addEventListener('load', () => {
  const savedKey = localStorage.getItem('summer_api_key');
  if (savedKey) {
    document.getElementById('api-key-input').value = savedKey;
    SUMMER_NAME = localStorage.getItem('summer_name') || 'Summer';
    USER_NAME = localStorage.getItem('summer_user_name') || '';
    document.getElementById('name-input').value = SUMMER_NAME;
    document.getElementById('user-name-input').value = USER_NAME;
  }
});
