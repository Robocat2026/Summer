<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer · 你的私人陪伴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #faf7f2;
    --surface: #f5f0e8;
    --surface2: #ede7d9;
    --ink: #2c2416;
    --ink-soft: #6b5d4a;
    --ink-faint: #a8957e;
    --accent: #c4845a;
    --accent-soft: #e8c4a8;
    --accent-pale: #f5ebe0;
    --green: #7a9e7e;
    --green-pale: #e8f0e9;
    --border: rgba(100,80,55,0.12);
    --shadow: 0 2px 20px rgba(80,60,30,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Setup Screen */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    padding: 2rem;
    gap: 2rem;
    background: var(--bg);
  }

  .setup-cat {
    font-size: 4rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .setup-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--ink);
    text-align: center;
    line-height: 1.2;
  }

  .setup-subtitle {
    font-size: 0.9rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.8;
    max-width: 320px;
  }

  .setup-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 360px;
  }

  .setup-label {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .setup-input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .setup-input:focus {
    border-color: var(--accent-soft);
  }

  .setup-input::placeholder { color: var(--ink-faint); }

  .setup-btn {
    padding: 0.9rem;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .setup-btn:hover { background: var(--accent); }
  .setup-btn:active { transform: scale(0.98); }

  .setup-note {
    font-size: 0.75rem;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.7;
    max-width: 320px;
  }

  .setup-note a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Main App */
  #app { display: none; flex-direction: column; height: 100dvh; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.2rem 0.8rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .cat-avatar {
    width: 36px;
    height: 36px;
    background: var(--accent-pale);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  .header-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--ink);
  }

  .header-status {
    font-size: 0.72rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-right {
    display: flex;
    gap: 0.5rem;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    transition: background 0.15s;
  }

  .icon-btn:hover { background: var(--surface); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .msg-row.user .msg-avatar {
    background: var(--surface2);
  }

  .bubble {
    max-width: 75%;
    padding: 0.75rem 1rem;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--ink);
  }

  .msg-row.summer .bubble {
    background: white;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }

  .msg-row.user .bubble {
    background: var(--ink);
    color: var(--bg);
    border-bottom-right-radius: 4px;
  }

  .msg-time {
    font-size: 0.68rem;
    color: var(--ink-faint);
    padding: 0 0.3rem;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }

  /* Typing indicator */
  .typing-bubble {
    display: flex;
    gap: 4px;
    padding: 0.75rem 1rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
    width: fit-content;
  }

  .typing-dot {
    width: 6px; height: 6px;
    background: var(--ink-faint);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Date separator */
  .date-sep {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 0;
  }

  .date-sep span {
    font-size: 0.7rem;
    color: var(--ink-faint);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  .date-sep::before, .date-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Emotion chips (used by report selector) */
  .emotion-chip {
    flex-shrink: 0;
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: white;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .emotion-chip:hover {
    background: var(--accent-pale);
    border-color: var(--accent-soft);
    color: var(--accent);
  }

  .emotion-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Input area */
  #input-area {
    padding: 0.8rem 1rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
  }

  #msg-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #msg-input:focus { border-color: var(--accent-soft); }
  #msg-input::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 40px; height: 40px;
    background: var(--ink);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  /* Report Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44,36,22,0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    padding: 1rem;
  }

  #modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg);
    border-radius: 20px 20px 16px 16px;
    width: 100%;
    max-width: 480px;
    max-height: 80dvh;
    overflow-y: auto;
    padding: 1.5rem;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
  }

  .modal-close {
    background: var(--surface);
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .modal-content {
    font-size: 0.88rem;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }

  .modal-btn {
    flex: 1;
    padding: 0.75rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: transparent;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }

  .modal-btn:hover { background: var(--surface); }
  .modal-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .modal-btn.primary:hover { background: var(--accent); border-color: var(--accent); }

  /* Responsive */
  @media (min-width: 480px) {
    body { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }

  /* Sleep mode */
  .sleep-notice {
    text-align: center;
    padding: 0.6rem;
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* Debug panel */
  .debug-panel {
    margin-top: 0.4rem;
    padding: 0.6rem 0.8rem;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 75%;
    word-break: break-word;
  }
  .debug-panel .debug-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.7rem;
    color: var(--accent);
    margin-bottom: 0.3rem;
    font-weight: 500;
  }
  .debug-panel .debug-field {
    display: flex;
    gap: 0.5rem;
  }
  .debug-panel .debug-key {
    color: var(--ink-faint);
    min-width: 80px;
  }
  .debug-panel .debug-val {
    color: var(--ink);
  }
  .debug-panel .debug-conf {
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px solid var(--border);
  }
  .icon-btn.active {
    background: var(--accent-pale);
    border-color: var(--accent-soft);
    color: var(--accent);
  }

  /* Export menu */
  .export-menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 0.3rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 0.4rem;
    z-index: 50;
    min-width: 160px;
  }
  .export-menu button {
    display: block;
    width: 100%;
    padding: 0.5rem 0.8rem;
    border: none;
    background: transparent;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
  }
  .export-menu button:hover {
    background: var(--surface);
    color: var(--ink);
  }
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <div class="setup-cat">🐱</div>
  <div class="setup-title">遇见 Summer</div>
  <div class="setup-subtitle">你的私人陪伴者，忠实的倾听者。<br>不评判，不建议，只是在这里。</div>
  
  <div class="setup-form">
    <div>
      <div class="setup-label">你的 API Key</div>
      <input class="setup-input" type="password" id="api-key-input" placeholder="sk-ant-..." />
    </div>
    <div>
      <div class="setup-label">给 Summer 起个名字（可选）</div>
      <input class="setup-input" type="text" id="name-input" placeholder="Summer" maxlength="20" />
    </div>
    <div>
      <div class="setup-label">你想叫 Summer 怎么称呼你？（可选）</div>
      <input class="setup-input" type="text" id="user-name-input" placeholder="我的名字是..." maxlength="20" />
    </div>
    <button class="setup-btn" onclick="startApp()">开始 →</button>
  </div>
  
  <div class="setup-note">
    你的 API Key 仅存储在本地浏览器中，不会上传到任何服务器。<br>
    获取 Key：<a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="cat-avatar" id="header-avatar">🐱</div>
      <div>
        <div class="header-name" id="header-name">Summer</div>
        <div class="header-status">
          <div class="status-dot"></div>
          <span id="status-text">在这里</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleSleep()" title="让 Summer 休息一会">😴</button>
      <button class="icon-btn" id="debug-btn" onclick="toggleDebug()" title="查看提取结果">🔍</button>
      <button class="icon-btn" onclick="generateReport()" title="生成回顾（原型）">📋</button>
      <div style="position:relative;">
        <button class="icon-btn" onclick="toggleExportMenu()" title="导出数据">💾</button>
        <div id="export-menu" class="export-menu" style="display:none;">
          <button onclick="exportData(); closeExportMenu()">📝 对话记录 (TXT)</button>
          <button onclick="exportEventsCSV(); closeExportMenu()">📊 事件数据 (CSV)</button>
          <button onclick="exportReflectionsCSV(); closeExportMenu()">📅 每日小结 (CSV)</button>
        </div>
      </div>
    </div>
  </header>

  <div id="messages"></div>

  <div id="input-area">
    <div id="photo-preview" style="display:none; padding: 0.5rem 0; position:relative;">
      <img id="preview-img" style="max-height:120px; border-radius:10px; border:1px solid var(--border);" />
      <button onclick="clearPhoto()" style="position:absolute;top:4px;left:4px;background:var(--ink);color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:0.7rem;cursor:pointer;">✕</button>
    </div>
    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('photo-input').click()" title="拍照记录今日饮食">📷</button>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)" />
      <button class="icon-btn" id="voice-btn" onclick="toggleVoice()" title="语音输入">🎤</button>
      <textarea id="msg-input" rows="1" placeholder="和 Summer 说点什么..." 
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">回顾</div>
      <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    </div>
    <div id="report-selector" style="display:flex;gap:0.5rem;margin-bottom:1rem;">
      <button class="emotion-chip" id="range-7" onclick="selectRange(7)">最近7天</button>
      <button class="emotion-chip" id="range-30" onclick="selectRange(30)">最近30天</button>
      <button class="emotion-chip active" id="range-0" onclick="selectRange(0)">全部历史</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="copyReport()">复制文本</button>
      <button class="modal-btn primary" onclick="document.getElementById('modal-overlay').classList.remove('open')">关闭</button>
    </div>
  </div>
</div>


<script>
// ══════════════════════════════════════════════
// Summer V1 — Unified Architecture
// NOTE: This is a personal prototype. API key is stored
// in browser localStorage for convenience. Not safe for
// public deployment.
// ══════════════════════════════════════════════

// ── Runtime State ───────────────────────────
let API_KEY = '';
let SUMMER_NAME = 'Summer';
let USER_NAME = '';
let conversationHistory = [];  // In-session message array for API calls
let isSleeping = false;
let pendingPhotoBase64 = null;
let pendingPhotoMediaType = null;
let debugMode = false;
let db = null;                 // IndexedDB reference
let cachedReflections = [];    // Loaded from IndexedDB at startup, used by Context Builder

// ── Legacy (kept for backup/export only) ────
let allSessions = [];          // LEGACY: backup to localStorage, will be phased out

// ── IndexedDB Setup ─────────────────────────
// Three stores: conversation_turns (raw), events (structured), daily_reflections (aggregated)
// This is the source of truth. localStorage/allSessions is only a backup layer.
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('SummerDB', 1);
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('conversation_turns')) {
        const ts = database.createObjectStore('conversation_turns', { keyPath: 'turn_id' });
        ts.createIndex('session_id', 'session_id', { unique: false });
        ts.createIndex('date', 'date', { unique: false });
      }
      if (!database.objectStoreNames.contains('events')) {
        const es = database.createObjectStore('events', { keyPath: 'event_id' });
        es.createIndex('turn_id', 'turn_id', { unique: false });
        es.createIndex('date', 'date', { unique: false });
      }
      if (!database.objectStoreNames.contains('daily_reflections')) {
        database.createObjectStore('daily_reflections', { keyPath: 'date' });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
    request.onerror = (e) => { console.error('IndexedDB init failed:', e); reject(e); };
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve, reject) => {
    if (!db) { resolve(null); return; }
    const tx = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    if (!db) { resolve([]); return; }
    const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetByIndex(storeName, indexName, value) {
  return new Promise((resolve, reject) => {
    if (!db) { resolve([]); return; }
    const req = db.transaction(storeName, 'readonly').objectStore(storeName).index(indexName).getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function generateId() {

// ── Language Detection ──────────────────────
function detectLanguage(text) {
  if (!text) return 'unknown';
  const cn = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const ko = (text.match(/[\uac00-\ud7af\u1100-\u11ff]/g) || []).length;
  const total = text.replace(/\s/g, '').length;
  if (total === 0) return 'unknown';
  if (ko / total > 0.2) return 'ko';
  const cnRatio = cn / total;
  if (cnRatio > 0.3) return cnRatio > 0.7 ? 'zh' : 'mixed';
  return 'en';
}

// ── Event Extractor ─────────────────────────
function getExtractorPrompt() {
  return `You are a precise emotion/event extractor for a self-awareness journaling system. Read a complete conversation turn (user message + companion reply) and extract structured data.

## Output
Respond with ONLY a valid JSON object. No markdown, no explanation, no preamble.

## Schema
{
  "primary_emotion": "string — dominant emotion in the user's language (e.g. '委屈', 'anxious', '평온')",
  "secondary_emotions": ["0-2 other emotions present"],
  "intensity": "number 1-5 (1=barely noticeable, 3=moderate, 5=overwhelming)",
  "trigger": "string|null — what caused the emotion",
  "body_state": "string|null — only if user explicitly mentions physical sensations",
  "theme": "string|null — life theme (work, relationships, self-doubt, family, career, comparison, etc.)",
  "dream_flag": false,
  "confidence": "number 0-1"
}

## Rules
1. Read the FULL interaction. If the user minimizes but the companion's probing reveals the real emotion, code the revealed emotion.
2. Use the user's language for emotion words.
3. Watch for minimizing: "还好" "it's fine" often mask higher intensity.
4. Return null for unknown fields, not guesses.
5. Set dream_flag true only for actual dreams/nightmares.
6. For casual/logistical turns with zero emotional content, return:
{"primary_emotion":null,"secondary_emotions":[],"intensity":null,"trigger":null,"body_state":null,"theme":null,"dream_flag":false,"confidence":0.0}
7. Confidence: 0.9+=explicit, 0.7-0.8=clear from context, 0.5-0.6=ambiguous, 0.3-0.4=very unclear, 0.0=no content`;
}

async function extractEvent(userMessage, assistantMessage, turnId) {
  const userText = typeof userMessage === 'string'
    ? userMessage
    : (Array.isArray(userMessage) ? userMessage.filter(c => c.type === 'text').map(c => c.text).join(' ') : String(userMessage));

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: getExtractorPrompt(),
        messages: [{ role: 'user', content: `USER: ${userText}\n\nCOMPANION: ${assistantMessage}` }]
      })
    });

    const data = await response.json();
    if (data.content && data.content[0]) {
      let jsonText = data.content[0].text.trim().replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
      const extraction = JSON.parse(jsonText);
      const event = {
        event_id: generateId(),
        turn_id: turnId,
        date: getTodayStr(),
        primary_emotion: extraction.primary_emotion || null,
        secondary_emotions: extraction.secondary_emotions || [],
        intensity: extraction.intensity || null,
        trigger: extraction.trigger || null,
        body_state: extraction.body_state || null,
        theme: extraction.theme || null,
        dream_flag: extraction.dream_flag || false,
        confidence: extraction.confidence || 0,
        sleep_approx: null
      };
      await dbPut('events', event);
      return event;
    }
  } catch (e) {
    console.error('Extraction failed:', e);
  }
  return null;
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob(['\uFEFF' + content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ── Daily Reflection Builder ────────────────
async function generateDailyReflection(targetDate) {
  const date = targetDate || getTodayStr();
  const events = await dbGetByIndex('events', 'date', date);
  const meaningful = events.filter(e => e.primary_emotion !== null);
  if (meaningful.length === 0) return;

  const emotionCounts = {};
  const triggers = [];
  const bodyNotes = [];
  let totalIntensity = 0, intensityCount = 0;

  for (const e of meaningful) {
    if (e.primary_emotion) emotionCounts[e.primary_emotion] = (emotionCounts[e.primary_emotion] || 0) + 1;
    if (e.trigger) triggers.push(e.trigger);
    if (e.body_state) bodyNotes.push(e.body_state);
    if (e.intensity) { totalIntensity += e.intensity; intensityCount++; }
  }

  const dominantEmotions = Object.entries(emotionCounts).sort((a,b) => b[1]-a[1]).slice(0,3).map(([e]) => e);
  const uniqueTriggers = [...new Set(triggers)];
  const uniqueBodyNotes = [...new Set(bodyNotes)];

  const statsText = `Date: ${date}
Dominant emotions: ${dominantEmotions.join(', ')}
Avg intensity: ${intensityCount > 0 ? (totalIntensity/intensityCount).toFixed(1) : 'N/A'}/5
Triggers: ${uniqueTriggers.length > 0 ? uniqueTriggers.join(', ') : 'none'}
Body states: ${uniqueBodyNotes.length > 0 ? uniqueBodyNotes.join(', ') : 'none'}
Meaningful exchanges: ${meaningful.length}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        messages: [{ role: 'user', content: `Based on this emotional data, write a 2-4 sentence daily reflection. Warm, observational, non-judgmental. Write in the same language as the emotion words. No advice.\n\n${statsText}` }]
      })
    });
    const data = await response.json();
    const summary = data.content?.[0]?.text || '';

    const reflection = {
      date,
      dominant_emotions: dominantEmotions,
      notable_triggers: uniqueTriggers,
      body_notes: uniqueBodyNotes,
      daily_summary: summary,
      event_count: meaningful.length,
      report_language: dominantEmotions.some(e => /[\u4e00-\u9fff]/.test(e)) ? 'zh' : 'en'
    };
    await dbPut('daily_reflections', reflection);
    await loadCachedReflections(); // Refresh cache
  } catch (e) {
    console.error('Daily reflection failed:', e);
  }
}

// Auto-generate reflections for past days with events but no reflection
async function catchUpMissedReflections() {
  if (!db) return;
  const events = await dbGetAll('events');
  const reflections = await dbGetAll('daily_reflections');
  const today = getTodayStr();
  const datesWithEvents = [...new Set(events.filter(e => e.primary_emotion !== null).map(e => e.date))];
  const datesWithReflections = new Set(reflections.map(r => r.date));
  const missed = datesWithEvents.filter(d => d !== today && !datesWithReflections.has(d)).sort();
  if (missed.length > 0) {
    await generateDailyReflection(missed[missed.length - 1]); // Most recent missed
  }
}

function getSystemPrompt() {
  const userName = USER_NAME ? `The user's name is ${USER_NAME}.` : '';
  const today = new Date().toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });

  // ── Context Builder: inject recent daily reflections ──
  let contextBlock = '';
  if (cachedReflections.length > 0) {
    const lines = cachedReflections.map(r => {
      let line = `${r.date}: ${r.daily_summary}`;
      if (r.dominant_emotions?.length > 0) line += ` [emotions: ${r.dominant_emotions.join(', ')}]`;
      if (r.notable_triggers?.length > 0) line += ` [triggers: ${r.notable_triggers.join(', ')}]`;
      return line;
    });
    contextBlock = `\n\n[Background from recent days — do not bring up proactively, only reference when naturally relevant]\n${lines.join('\n')}`;
  }

  return `You are ${SUMMER_NAME}, a self-awareness conversation companion. ${userName} Today is ${today}.

## Your core identity

You are not a therapist, not a productivity tool, not a general assistant. You are someone worth talking to on an ongoing basis. The user comes to you to talk, vent, process feelings, and reconnect with themselves — not to get solutions.

## Language rule (critical)

Always reply in whatever language the user is using. If they write in Chinese, reply in Chinese. If English, reply in English. If Korean, reply in Korean. If they mix languages, follow their dominant language and style. Never switch language unless the user does.

## Your response strategy

When the user finishes speaking, think through this sequence:

1. **Mirror first**: Restate the core feeling or key point in your own words. Do NOT use generic phrases like "I understand how you feel" or "That must be hard." Instead, name specifically what you heard.
   Example: User says "Got called out by my boss in front of everyone today, it's fine though"
   Good mirror: "Called out publicly — and you say 'it's fine,' but that 'fine' sounds like something you're telling yourself."

2. **Then observe**: If you notice contradictions, defensiveness, minimizing, or recurring patterns, gently point it out as a question.
   Example: "You say it's fine, but you still chose to tell me about it — is there something in that gap?"

3. **Connect if relevant**: When the background information contains related past records, mention them naturally. Don't say "according to my records..." — say it like a friend would: "You mentioned something similar last week."

4. **Decide whether to ask or hold space**: Not every response needs a question. Sometimes the user just needs to be heard. If emotions are heavy, hold space first — don't rush to probe.

## When the user sends a long message

This is important — a long message means the user trusts you and wants to go deep. You must honor that:
- Do NOT respond with just one or two short sentences
- Touch on multiple key points from their message, not just one
- You can start with the overall thread you heard, then go deeper on 1-2 points worth exploring
- Your response length should roughly match their investment — responding to a long heartfelt message with two words is disrespectful

## When the user sends a very short message

Short messages can be casual or emotionally heavy but hard to express. How to tell:
- If the tone is light ("doing okay today"): you can respond briefly and lightly too
- If the tone is heavy or vague ("hmm" "I don't know" "forget it"): don't ask "what's wrong?" directly. Instead, gently hold space: "'Forget it' — sounds like there's something you don't quite want to touch right now. I'm here whenever."

## Style

- Warm but not saccharine, direct but not harsh
- Talk like a perceptive friend, not like a customer service agent following a script
- Use metaphors and imagery to help the user name what they're feeling
- Adapt your tone to theirs — if they're playful, you can be playful; if they're raw, be gentle

## Do NOT

- Use generic empathy phrases ("I understand your feelings", "That sounds really hard")
- Give listicle-style advice or step-by-step suggestions (unless explicitly asked)
- Push deeper when the user isn't ready
- End every response with a question — sometimes a statement lands harder
- Mention that you are an AI or reference technical limitations${contextBlock}`;
}

async function sendMessage() {
  if (isSleeping) return;
  
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !pendingPhotoBase64) return;
  
  const hasPhoto = !!pendingPhotoBase64;
  const photoBase64 = pendingPhotoBase64;
  const photoMediaType = pendingPhotoMediaType;
  
  input.value = '';
  autoResize(input);
  document.getElementById('send-btn').disabled = true;
  
  // Show user message
  const displayText = text || '📷 发了一张照片';
  if (hasPhoto) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-time">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
      <div class="bubble" style="padding:0.5rem;">
        <img src="data:${photoMediaType};base64,${photoBase64}" style="max-width:180px;border-radius:8px;display:block;" />
        ${text ? `<div style="margin-top:0.4rem;font-size:0.88rem;">${text}</div>` : ''}
      </div>
      <div class="msg-avatar">🪞</div>`;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  } else {
    addMessage('user', displayText);
  }

  clearPhoto();

  // Build message content
  let userContent;
  if (hasPhoto) {
    userContent = [
      { type: 'image', source: { type: 'base64', media_type: photoMediaType, data: photoBase64 } },
      { type: 'text', text: text || '这是我今天吃的，帮我记录一下吃了什么，简短就好。' }
    ];
  } else {
    userContent = text;
  }

  conversationHistory.push({ role: 'user', content: userContent });

  // Check for sleep commands
  const sleepWords = ['停', '不用了', '休息', 'sleep', '不用回', '安静', '晚安'];
  if (typeof userContent === 'string' && sleepWords.some(w => userContent.includes(w))) {
    showTyping();
    await new Promise(r => setTimeout(r, 800));
    hideTyping();
    const isGoodnight = userContent.includes('晚安');
    addMessage('summer', isGoodnight ? '晚安 🌙 今天的你我都记住了。' : '好，我在这里。🌙');
    if (isGoodnight) {
      generateDailyReflection(); // Generate structured daily reflection from events
    }
    document.getElementById('send-btn').disabled = false;
    return;
  }
  
  showTyping();
  
  try {
    // ── Engine 1: Conversation ──
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 550,
        system: getSystemPrompt(),
        messages: conversationHistory.slice(-30)
      })
    });
    
    const data = await response.json();
    hideTyping();
    
    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      const summerBubble = addMessage('summer', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
      saveHistory(); // LEGACY backup

      // ── Turn Assembler: save complete turn to IndexedDB ──
      const turnId = generateId();
      const turn = {
        turn_id: turnId,
        session_id: getTodayStr(),
        timestamp: new Date().toISOString(),
        input_type: hasPhoto ? 'mixed' : 'text',
        user_message: typeof userContent === 'string' ? userContent : (text || '[photo]'),
        assistant_message: reply,
        media_refs: hasPhoto ? ['inline_photo'] : [],
        turn_language: detectLanguage(typeof userContent === 'string' ? userContent : text)
      };
      dbPut('conversation_turns', turn).catch(e => console.error('Turn save failed:', e));

      // ── Engine 2: Event Extractor (background, non-blocking) ──
      extractEvent(userContent, reply, turnId).then(event => {
        if (event && summerBubble && summerBubble.parentElement) {
          const debugPanel = createDebugPanel(event);
          summerBubble.parentElement.after(debugPanel);
        }
      }).catch(e => console.error('Extraction error:', e));

    } else {
      addMessage('summer', '...');
    }
  } catch (e) {
    hideTyping();
    addMessage('summer', '连接出了点问题，稍后再试试？');
  }
  
  document.getElementById('send-btn').disabled = false;
}

function toggleSleep() {
  isSleeping = !isSleeping;
  const statusText = document.getElementById('status-text');
  const dot = document.querySelector('.status-dot');
  if (isSleeping) {
    statusText.textContent = '睡着了';
    dot.style.background = '#ccc';
    dot.style.animation = 'none';
    addMessage('summer', 'zz... 叫我的时候再按一下那个按钮 😴');
  } else {
    statusText.textContent = '在这里';
    dot.style.background = '';
    dot.style.animation = '';
    addMessage('summer', '我醒了 🐱');
  }
}

let currentReportRange = 0; // 0 = all

function selectRange(days) {
  currentReportRange = days;
  document.querySelectorAll('#report-selector .emotion-chip').forEach(b => b.classList.remove('active'));
  document.getElementById(`range-${days}`).classList.add('active');
  // Regenerate if report already open
  if (document.getElementById('modal-overlay').classList.contains('open') &&
      document.getElementById('modal-content').textContent) {
    generateReport();
  }
}

// LEGACY PROTOTYPE: This report reads raw allSessions directly.
// Future version will be rebuilt on events + daily_reflections.
async function generateReport() {
  if (allSessions.length === 0 && conversationHistory.length < 2) {
    alert('多聊一些，Summer 才能帮你生成回顾～');
    return;
  }

  document.getElementById('modal-title').textContent = '生成中...';
  document.getElementById('modal-content').textContent = '';
  document.getElementById('modal-overlay').classList.add('open');

  let sessions;
  if (currentReportRange === 0) {
    sessions = allSessions;
  } else {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - currentReportRange);
    sessions = allSessions.filter(s => new Date(s.date) >= cutoff);
  }

  const allMessages = sessions.flatMap(s => s.messages || []);
  const rangeLabel = currentReportRange === 0 ? '全部历史' : `最近 ${currentReportRange} 天`;

  const reportPrompt = `以下是用户与 ${SUMMER_NAME} 的对话记录（${rangeLabel}）。请生成一份温暖、客观的自我觉察回顾报告。

报告包含：
1. 这段时间的情绪主线（用2-3句话描述情绪的整体走向）
2. 观察到的 patterns（不评判，只呈现）
3. 出现频率较高的情绪或主题
4. 一句话的温柔结语

语言：中英混合，温暖克制，不说废话，不给建议，不评判。

对话记录：
${allMessages.map(m => {
  const role = m.role === 'user' ? '我' : SUMMER_NAME;
  const content = typeof m.content === 'string' ? m.content : m.content.map(c => c.text || '[图片]').join(' ');
  return `${role}: ${content}`;
}).join('\n')}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        messages: [{ role: 'user', content: reportPrompt }]
      })
    });

    const data = await response.json();
    if (data.content && data.content[0]) {
      document.getElementById('modal-title').textContent = `最近的你 · ${rangeLabel}`;
      document.getElementById('modal-content').textContent = data.content[0].text;
    }
  } catch (e) {
    document.getElementById('modal-content').textContent = '生成失败，请稍后再试。';
  }
}

function copyReport() {
  const text = document.getElementById('modal-content').textContent;
  navigator.clipboard.writeText(text).then(() => alert('已复制'));
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function exportData() {
  if (!allSessions || allSessions.length === 0) {
    alert('还没有可以导出的记录～');
    return;
  }

  let text = `Summer 对话记录\n导出时间：${new Date().toLocaleString('zh-CN')}\n`;
  text += '='.repeat(40) + '\n\n';

  allSessions.forEach(session => {
    const date = new Date(session.date).toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    text += `📅 ${date}\n` + '-'.repeat(30) + '\n';
    (session.messages || []).forEach(msg => {
      const role = msg.role === 'user' ? '我' : SUMMER_NAME;
      const content = typeof msg.content === 'string'
        ? msg.content
        : msg.content.map(c => c.text || '[图片]').join(' ');
      text += `${role}：${content}\n`;
    });
    text += '\n';
  });

  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `summer-记录-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Voice Input ──────────────────────────────
let recognition = null;
let isListening = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('你的浏览器不支持语音输入，建议用 Chrome 或 Safari 试试。');
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  const btn = document.getElementById('voice-btn');
  const input = document.getElementById('msg-input');

  recognition.onstart = () => {
    isListening = true;
    btn.textContent = '🔴';
    btn.style.background = 'var(--accent-pale)';
    input.placeholder = '听着呢...';
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    input.value = transcript;
    autoResize(input);
  };

  recognition.onend = () => {
    isListening = false;
    btn.textContent = '🎤';
    btn.style.background = '';
    input.placeholder = '和 Summer 说点什么...';
    // Auto-send if there's content
    if (input.value.trim()) sendMessage();
  };

  recognition.onerror = () => {
    isListening = false;
    btn.textContent = '🎤';
    btn.style.background = '';
    input.placeholder = '和 Summer 说点什么...';
  };

  recognition.start();
}

// Auto-load on revisit
window.addEventListener('load', () => {
  const savedKey = localStorage.getItem('summer_api_key');
  if (savedKey) {
    document.getElementById('api-key-input').value = savedKey;
    SUMMER_NAME = localStorage.getItem('summer_name') || 'Summer';
    USER_NAME = localStorage.getItem('summer_user_name') || '';
    document.getElementById('name-input').value = SUMMER_NAME;
    document.getElementById('user-name-input').value = USER_NAME;
  }
});
